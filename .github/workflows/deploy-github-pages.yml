on:
  push:
    branches:
      - main

name: Deploy Github Pages
jobs:
  builddeploy:
    name: Data Import and Export
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        root-project-path: [./]
    steps:
    - uses: actions/checkout@v4
    - name: setup ubuntu
      run: |
        sudo apt-get --quiet update --yes
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: yarn install
      working-directory: ${{ matrix.root-project-path }}
      run: yarn install
    - name: Register .env
      working-directory: ${{ matrix.root-project-path }}
      env:
        BASE_PATH: ${{ secrets.BASE_PATH }}
        NEXT_PUBLIC_VOICEVOX_API_ROOT_URL: ${{ secrets.NEXT_PUBLIC_VOICEVOX_API_ROOT_URL }}
      run: |
        echo "BASE_PATH=${BASE_PATH}" >> ./.env
        echo "NEXT_PUBLIC_VOICEVOX_API_ROOT_URL=${NEXT_PUBLIC_VOICEVOX_API_ROOT_URL}" >> ./.env
    - name: build html
      working-directory: ${{ matrix.root-project-path }}
      run: yarn run build
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        publish_dir: ${{ matrix.root-project-path }}/out